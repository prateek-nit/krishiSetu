<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmers — KrishiSetu Admin</title>
  <link rel="icon" href="../assets/krishisetu_logo.png" type="image/png">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header"><img src="../assets/krishisetu_logo.png" alt="KrishiSetu" class="sidebar-logo"><div class="sidebar-brand">Krishi<span>Setu</span></div></div>
      <nav class="sidebar-nav">
        <div class="sidebar-section"><div class="sidebar-section-title">Administration</div>
          <a href="dashboard.html" class="nav-link"><i data-feather="bar-chart-2"></i> Dashboard</a>
          <a href="centres.html" class="nav-link"><i data-feather="map-pin"></i> Centres</a>
          <a href="farmers.html" class="nav-link active"><i data-feather="users"></i> Farmers</a>
          <a href="payments.html" class="nav-link"><i data-feather="credit-card"></i> Payments</a>
          <a href="analytics.html" class="nav-link"><i data-feather="pie-chart"></i> Analytics</a>
        </div>
      </nav>
      <div class="sidebar-footer"><div class="sidebar-user" onclick="Auth.logout()"><div class="sidebar-avatar" id="user-avatar">PV</div><div class="sidebar-user-info"><div class="sidebar-user-name" id="user-name">Dr. Priya Verma</div><div class="sidebar-user-role">Admin • Logout</div></div></div></div>
    </aside>

    <main class="main-content">
      <header class="page-header">
        <div>
          <button class="hamburger" onclick="document.getElementById('sidebar').classList.toggle('open')"><span></span><span></span><span></span></button>
          <h1 class="page-title">Farmer Directory</h1>
          <p class="page-subtitle">State farmer registry and revenue dossiers</p>
        </div>
      </header>

      <div class="page-body">
        <!-- Search & Filter -->
        <div class="filter-toolbar">
          <div class="search-box" style="max-width:400px;">
            <i data-feather="search"></i>
            <input type="text" placeholder="Search by name, Kisan ID, or village..." id="farmer-search" oninput="filterFarmers()">
          </div>
          <select class="form-select" style="width:160px;" id="district-filter" onchange="filterFarmers()">
            <option value="">All Districts</option>
            <option value="Bhopal">Bhopal</option>
            <option value="Sehore">Sehore</option>
            <option value="Vidisha">Vidisha</option>
            <option value="Raisen">Raisen</option>
          </select>
          <span class="text-sm text-muted" id="farmer-count">Showing 5 farmers</span>
        </div>

        <!-- Farmers Table -->
        <div class="table-container">
          <table class="table">
            <thead>
              <tr>
                <th>Farmer</th>
                <th>Kisan ID</th>
                <th>Village / District</th>
                <th>Land (Ha)</th>
                <th>Phone</th>
                <th>Aadhaar</th>
                <th>DBT Seeded</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="farmers-body"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Farmer Detail Modal -->
  <div class="modal-backdrop" id="farmer-modal">
    <div class="modal" style="max-width:600px;">
      <div class="modal-header">
        <h3 class="modal-title">Farmer Profile</h3>
        <button class="modal-close" onclick="document.getElementById('farmer-modal').classList.remove('show')"><i data-feather="x" style="width:16px;height:16px;"></i></button>
      </div>
      <div id="farmer-detail-content"></div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    feather.replace();
    if (!Auth.requireAuth('admin')) {}
    const user = Auth.getUser();
    if(user){document.getElementById('user-name').textContent=user.name;document.getElementById('user-avatar').textContent=user.avatar;}

    const allFarmers = API.getFarmers();

    function renderFarmers(farmers) {
      document.getElementById('farmers-body').innerHTML = farmers.map(f => `
        <tr>
          <td>
            <div class="flex items-center gap-3">
              <div class="sidebar-avatar" style="width:36px;height:36px;font-size:0.75rem;background:linear-gradient(135deg,var(--color-primary),var(--color-gold));">${f.avatar}</div>
              <div>
                <div style="font-weight:600;">${f.name}</div>
                <div style="font-size:0.75rem;color:var(--color-text-secondary);">${f.state}</div>
              </div>
            </div>
          </td>
          <td><code style="font-size:0.75rem;background:var(--color-bg);padding:2px 8px;border-radius:4px;">${f.kisanId}</code></td>
          <td>${f.village}, ${f.district}</td>
          <td>${f.landAreaHa} Ha</td>
          <td>${f.phone}</td>
          <td style="font-family:monospace;font-size:0.8125rem;">${f.aadhaarMasked}</td>
          <td>${f.dbtSeeded ? '<span class="badge badge-success">✓ Seeded</span>' : '<span class="badge badge-danger">✗ Not Seeded</span>'}</td>
          <td><button class="btn btn-ghost btn-sm" onclick='showFarmerDetail(${JSON.stringify(f)})'><i data-feather="eye"></i></button></td>
        </tr>
      `).join('');
      document.getElementById('farmer-count').textContent = `Showing ${farmers.length} farmers`;
      feather.replace();
    }

    function filterFarmers() {
      const query = document.getElementById('farmer-search').value.toLowerCase();
      const district = document.getElementById('district-filter').value;
      let filtered = allFarmers;
      if (query) filtered = filtered.filter(f => f.name.toLowerCase().includes(query) || f.kisanId.toLowerCase().includes(query) || f.village.toLowerCase().includes(query));
      if (district) filtered = filtered.filter(f => f.district === district);
      renderFarmers(filtered);
    }

    function showFarmerDetail(f) {
      const crops = API.getFarmerCrops(f.id);
      const payments = API.getPayments({ farmerId: f.id });
      const totalPaid = payments.filter(p => p.status === 'COMPLETED').reduce((sum, p) => sum + p.amount, 0);

      document.getElementById('farmer-detail-content').innerHTML = `
        <div class="flex items-center gap-4 mb-6" style="margin-bottom:24px;">
          <div class="sidebar-avatar" style="width:56px;height:56px;font-size:1.25rem;background:linear-gradient(135deg,var(--color-primary),var(--color-gold));">${f.avatar}</div>
          <div>
            <h3 style="font-size:1.25rem;font-weight:700;">${f.name}</h3>
            <p style="font-size:0.8125rem;color:var(--color-text-secondary);">${f.kisanId} • ${f.village}, ${f.district}</p>
          </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px;">
          <div style="background:var(--color-bg);padding:12px;border-radius:10px;">
            <div style="font-size:0.7rem;color:var(--color-text-secondary);font-weight:600;">PHONE</div>
            <div style="font-weight:600;margin-top:4px;">${f.phone}</div>
          </div>
          <div style="background:var(--color-bg);padding:12px;border-radius:10px;">
            <div style="font-size:0.7rem;color:var(--color-text-secondary);font-weight:600;">AADHAAR</div>
            <div style="font-weight:600;margin-top:4px;font-family:monospace;">${f.aadhaarMasked}</div>
          </div>
          <div style="background:var(--color-bg);padding:12px;border-radius:10px;">
            <div style="font-size:0.7rem;color:var(--color-text-secondary);font-weight:600;">LAND AREA</div>
            <div style="font-weight:600;margin-top:4px;">${f.landAreaHa} Hectares</div>
          </div>
          <div style="background:var(--color-bg);padding:12px;border-radius:10px;">
            <div style="font-size:0.7rem;color:var(--color-text-secondary);font-weight:600;">BANK</div>
            <div style="font-weight:600;margin-top:4px;">${f.bankAccount} (${f.ifsc})</div>
          </div>
          <div style="background:var(--color-bg);padding:12px;border-radius:10px;">
            <div style="font-size:0.7rem;color:var(--color-text-secondary);font-weight:600;">DBT STATUS</div>
            <div style="margin-top:4px;">${f.dbtSeeded ? '<span class="badge badge-success">Seeded</span>' : '<span class="badge badge-danger">Not Seeded</span>'}</div>
          </div>
          <div style="background:var(--color-primary-light);padding:12px;border-radius:10px;">
            <div style="font-size:0.7rem;color:var(--color-text-secondary);font-weight:600;">TOTAL RECEIVED</div>
            <div style="font-weight:800;margin-top:4px;color:var(--color-primary);font-size:1.125rem;">${API.formatCurrency(totalPaid)}</div>
          </div>
        </div>

        <h4 style="font-weight:700;margin-bottom:12px;">Registered Crops (${crops.length})</h4>
        ${crops.length > 0 ? crops.map(c => `
          <div style="background:var(--color-bg);padding:12px;border-radius:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;">
            <div>
              <div style="font-weight:600;">${c.cropName} — ${c.variety}</div>
              <div style="font-size:0.75rem;color:var(--color-text-secondary);">${c.sownAreaAcres} Acres • ${c.estimatedYieldQuintals} Qtl est.</div>
            </div>
            <span class="badge badge-primary">${c.season}</span>
          </div>
        `).join('') : '<p style="color:var(--color-text-secondary);font-size:0.875rem;">No crops registered.</p>'}
      `;
      document.getElementById('farmer-modal').classList.add('show');
      feather.replace();
    }

    renderFarmers(allFarmers);
  </script>
</body>
</html>
