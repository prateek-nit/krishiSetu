<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Today's Bookings — KrishiSetu Staff</title>
  <link rel="icon" href="../assets/krishisetu_logo.png" type="image/png">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header"><img src="../assets/krishisetu_logo.png" alt="KrishiSetu" class="sidebar-logo"><div class="sidebar-brand">Krishi<span>Setu</span></div></div>
      <nav class="sidebar-nav">
        <div class="sidebar-section"><div class="sidebar-section-title">Operations</div>
          <a href="dashboard.html" class="nav-link"><i data-feather="monitor"></i> Dashboard</a>
          <a href="bookings.html" class="nav-link active"><i data-feather="list"></i> Today's Bookings</a>
          <a href="queue.html" class="nav-link"><i data-feather="users"></i> Queue Management</a>
          <a href="procurement.html" class="nav-link"><i data-feather="package"></i> Procurement</a>
        </div>
      </nav>
      <div class="sidebar-footer"><div class="sidebar-user" onclick="Auth.logout()"><div class="sidebar-avatar" id="user-avatar">AS</div><div class="sidebar-user-info"><div class="sidebar-user-name" id="user-name">Amit Sharma</div><div class="sidebar-user-role">Staff • Logout</div></div></div></div>
    </aside>

    <main class="main-content">
      <header class="page-header">
        <div>
          <button class="hamburger" onclick="document.getElementById('sidebar').classList.toggle('open')"><span></span><span></span><span></span></button>
          <h1 class="page-title">Today's Bookings</h1>
          <p class="page-subtitle">Manage arrivals and booking status</p>
        </div>
      </header>

      <div class="page-body">
        <div class="filter-toolbar">
          <div class="filter-group">
            <button class="filter-chip active" onclick="filterBookings('all',this)">All (5)</button>
            <button class="filter-chip" onclick="filterBookings('BOOKED',this)">Booked</button>
            <button class="filter-chip" onclick="filterBookings('ARRIVED',this)">Arrived</button>
            <button class="filter-chip" onclick="filterBookings('WAITING',this)">Waiting</button>
            <button class="filter-chip" onclick="filterBookings('COMPLETED',this)">Completed</button>
          </div>
          <div class="search-box">
            <i data-feather="search"></i>
            <input type="text" placeholder="Search by token or farmer name..." oninput="searchBookings(this.value)">
          </div>
        </div>

        <div class="table-container">
          <table class="table">
            <thead>
              <tr>
                <th>Token</th>
                <th>Farmer</th>
                <th>Crop</th>
                <th>Quantity</th>
                <th>Time Slot</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="bookings-body"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    feather.replace();
    if (!Auth.requireAuth('staff')) {}
    const user = Auth.getUser();
    if(user){document.getElementById('user-name').textContent=user.name;document.getElementById('user-avatar').textContent=user.avatar;}

    let allBookings = API.getBookings({ centreId: 'PC001' });

    function renderBookings(bookings) {
      document.getElementById('bookings-body').innerHTML = bookings.map(b => `
        <tr>
          <td><strong style="font-size:1rem;">${b.tokenNumber}</strong></td>
          <td>
            <div style="font-weight:600;">${b.farmerName}</div>
          </td>
          <td>${b.cropName}</td>
          <td>${b.quantityQuintals} Qtl</td>
          <td>${b.timeSlot}</td>
          <td><span class="badge ${API.getStatusBadgeClass(b.status)}">${b.status.replace(/_/g,' ')}</span></td>
          <td>
            ${b.status === 'BOOKED' ? `<button class="btn btn-primary btn-sm" onclick="markArrived('${b.id}')"><i data-feather="log-in"></i> Mark Arrived</button>` : ''}
            ${b.status === 'ARRIVED' ? `<button class="btn btn-accent btn-sm" onclick="moveToQueue('${b.id}')"><i data-feather="users"></i> Add to Queue</button>` : ''}
            ${b.status === 'WAITING' ? `<span class="text-sm text-muted">In queue</span>` : ''}
            ${['COMPLETED','PAYMENT_COMPLETED'].includes(b.status) ? `<span class="text-sm text-muted">Done</span>` : ''}
          </td>
        </tr>
      `).join('');
      feather.replace();
    }

    function filterBookings(status, btn) {
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      const filtered = status === 'all' ? allBookings : allBookings.filter(b => b.status === status);
      renderBookings(filtered);
    }

    function searchBookings(query) {
      const q = query.toLowerCase();
      const filtered = allBookings.filter(b => b.tokenNumber.toLowerCase().includes(q) || b.farmerName.toLowerCase().includes(q));
      renderBookings(filtered);
    }

    function markArrived(id) {
      API.updateBookingStatus(id, 'ARRIVED');
      allBookings = API.getBookings({ centreId: 'PC001' });
      renderBookings(allBookings);
    }

    function moveToQueue(id) {
      API.updateBookingStatus(id, 'WAITING');
      allBookings = API.getBookings({ centreId: 'PC001' });
      renderBookings(allBookings);
    }

    renderBookings(allBookings);
  </script>
</body>
</html>
